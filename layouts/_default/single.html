{{- /* 幻梦 Illusion v1.1.0 - 正式预览版 */ -}}
{{- /* 默认单页模板：用于显示任意单页内容，含页面标题和 Markdown 正文 */ -}}
{{ define "main" }}
<article class="article-page">
  <div class="container">
    {{- /* 文章描述区：显示页面标题 */ -}}
    <div class="article-desc">
      {{ partial "_components/page-header.html" (dict
        "Title" .Title
        "Icon" "fas fa-file-alt"
      ) }}
    </div>
    {{- /* 文章正文区域 */ -}}
    <div class="article-body-wrap">
      <div class="article-left">
        <div class="article-text">{{ .Content }}</div>
      </div>
    </div>
  </div>
</article>
{{ end }}
