{{- /* Schema.org 结构化数据模板：输出 Organization 和 WebSite 的 JSON-LD 数据，含站点信息和搜索功能声明 */ -}}
{{- if .Site.Params.enableSchema }}
{{- /* Organization 结构化数据 */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ site.Title }}",
  "url": "{{ site.BaseURL }}",
  "logo": "{{ (hugo.Data.theme.assets).avatar.url | default "/headimg.jpg" | absURL }}",
  "description": "{{ .Site.Params.description }}",
  "email": "{{ .Site.Params.email }}",
  "author": { "@type": "Person", "name": "{{ .Site.Params.author }}" }
}
</script>
{{- /* WebSite 结构化数据（含搜索功能声明） */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.Title }}",
  "url": "{{ site.BaseURL }}",
  "description": "{{ .Site.Params.description }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ site.BaseURL }}search/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
{{- end }}
