{{- /* 幻梦 Illusion v1.1.0 - 正式预览版 */ -}}
{{- /* 搜索模态框模板：全屏遮罩搜索弹窗，包含搜索表单、关闭按钮和无障碍属性 */ -}}
{{- if .Site.Params.enableSearch -}}
<div class="search-modal-overlay" id="search-modal-overlay" aria-hidden="true"></div>
<div class="search-modal" id="search-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="search-modal-title">
  <div class="search-modal-header">
    <h2 id="search-modal-title" class="search-modal-title">{{ i18n "search_title" }}</h2>
    <button class="search-modal-close" id="search-modal-close" aria-label="{{ i18n "search_close" }}"><i class="fas fa-times"></i></button>
  </div>
  <div class="search-modal-body">{{ partial "_layout/search.html" . }}</div>
</div>
{{- end -}}
