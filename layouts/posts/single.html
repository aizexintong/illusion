{{ define "main" }}
<article class="article-page">
  <div class="container">
    {{ partial "_components/article-header.html" . }}

    {{ if .Description }}
    <div class="article-desc"><p>{{ .Description }}</p></div>
    {{ end }}

    <div class="article-body-wrap">
      <div class="article-left">
        <div class="article-text">{{ .Content }}</div>
      </div>
      {{ partial "_components/sidebar-article.html" . }}
    </div>

    {{ partial "_components/article-footer-nav.html" . }}
    {{ partial "_layout/comments.html" . }}
  </div>
</article>
{{ end }}
