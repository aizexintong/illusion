    perPage: 25


# ============================================================================
# 布局与视觉策略
# ============================================================================
# 注意：
#   这里描述“开关和策略”，不要放具体 CSS 数值。
#
#   例如：
#     glass: true
#
#   而不是：
#     glassBlur: 24px
#
# 具体数值统一交给 main.scss Token。
# ============================================================================

layout:

  # --------------------------------------------------------------------------
  # 文章列表
  # --------------------------------------------------------------------------
  posts:
    layout: "grid"
    columns: 2
    perPage: 12
    excerptLength: 160

    showDate: true
    showCategory: true
    showTags: true
    showExcerpt: true


  # --------------------------------------------------------------------------
  # 技能
  # --------------------------------------------------------------------------
  skills:
    layout: "grid"
    showCategories: true
    showDetailed: true
    showTimeline: true
    showProjects: true


  # --------------------------------------------------------------------------
  # 友链
  # --------------------------------------------------------------------------
  links:
    showCategory: true


  # --------------------------------------------------------------------------
  # 侧边栏
  # --------------------------------------------------------------------------
  sidebar:
    position: "right"
    showTOC: true
    showInfo: true
    showTags: true


  # --------------------------------------------------------------------------
  # 代码块
  # --------------------------------------------------------------------------
  codeblock:
    showLang: true
    showCopy: true
    expandLines: 0
    lineNumbers: false


  # ==========================================================================
  # v1.1.0 视觉效果
  # ==========================================================================

  effects:

    # 总开关
    enabled: true

    # ------------------------------------------------------------------------
    # Glass / 毛玻璃
    # ------------------------------------------------------------------------
    glass: true

    # ------------------------------------------------------------------------
    # 背景极光
    # CSS 优先，不依赖 Canvas
    # ------------------------------------------------------------------------
    aurora: true

    # ------------------------------------------------------------------------
    # 鼠标跟随光晕
    # 桌面端开启，移动端由 TS 自动禁用
    # ------------------------------------------------------------------------
    mouseGlow: true

    # ------------------------------------------------------------------------
    # 卡片轻微 3D
    # TS 只负责计算变量，实际 transform 由 CSS 完成
    # ------------------------------------------------------------------------
    card3d: true

    # ------------------------------------------------------------------------
    # 卡片流光边缘
    # 不会默认应用到所有卡片，仅用于重点组件
    # ------------------------------------------------------------------------
    cardShine: true

    # ------------------------------------------------------------------------
    # Scroll Reveal
    # ------------------------------------------------------------------------
    scrollReveal: true

    # ------------------------------------------------------------------------
    # Canvas 粒子
    # ------------------------------------------------------------------------
    particles: true

    # ------------------------------------------------------------------------
    # 夜间星尘 / 流星 / 萤火虫
    # ------------------------------------------------------------------------
    nightSky: true

    # ------------------------------------------------------------------------
    # 页面背景微噪点
    # CSS 优先
    # ------------------------------------------------------------------------
    noise: true


  # ==========================================================================
  # v1.1.0 Hero
  # ==========================================================================

  hero:

    # Hero 是否启用高级视觉层
    enhanced: true

    # Hero 背景极光
    aurora: true

    # Hero 玻璃内容层
    glass: true

    # Hero 鼠标交互
    mouseGlow: true

    # Hero 是否显示装饰性粒子
    particles: true

    # Hero 是否启用轻微浮动
    floating: true


  # ==========================================================================
  # v1.1.0 Card
  # ==========================================================================

  cards:

    # 普通卡片玻璃效果
    glass: true

    # Hover 上浮
    lift: true

    # Hover 光晕
    glow: true

    # 鼠标跟随高光
    mouseGlow: true

    # 3D 倾斜
    tilt: true

    # 图片 hover zoom
    imageZoom: true


  # ==========================================================================
  # v1.1.0 Article
  # ==========================================================================

  article:

    # 阅读进度条
    readingProgress: true

    # 标题区域增强
    enhancedHeader: true

    # 文章封面视觉增强
    coverEffect: true

    # 文章正文阅读宽度优化
    readableLayout: true

    # 推荐文章增强
    relatedPosts: true


  # ==========================================================================
  # v1.1.0 Performance
  # ==========================================================================
  #
  # auto:
  #   true  -> TS 根据设备能力自动选择
  #   false -> 使用 level 强制指定
  #
  # level:
  #   low
  #   normal
  #   high
  #
  # 以后如果需要测试特效性能，可以直接：
  #
  #   auto: false
  #   level: low
  #
  # 不需要修改 TS。
  # ==========================================================================

  performance:

    # 自动性能等级
    auto: true

    # auto=false 时使用
    level: "normal"

    # reduced-motion 用户强制降级
    respectReducedMotion: true

    # 页面进入后台时暂停 Canvas / 动画
    pauseWhenHidden: true

    # 移动设备自动降低特效
    reduceOnMobile: true

    # 低性能设备自动降低特效
    reduceOnLowPower: true

    # Canvas 自动降低 DPR
    adaptiveDpr: true

    # Canvas 粒子数量动态调整
    adaptiveParticles: true

    # 根据 FPS 自动降级
    adaptiveFps: true


  # ==========================================================================
  # v1.1.0 Accessibility
  # ==========================================================================

  accessibility:

    # 尊重 prefers-reduced-motion
    reducedMotion: true

    # 保证键盘导航
    keyboardNavigation: true

    # 保证焦点可见
    visibleFocus: true

    # 保证装饰层不影响交互
    decorativeEffectsPointerEventsNone: true