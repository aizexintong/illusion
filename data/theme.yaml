# ============================================================================
# 技能页面
# ============================================================================
skills:
  overview:
    categories:
      - icon: "fas fa-code"
        title: "前端开发"
        description: "HTML5、CSS3、JavaScript、React"
        progress: 100
      - icon: "fas fa-server"
        title: "后端开发"
        description: "Node.js、Python、数据库、API"
        progress: 100
      - icon: "fas fa-mobile-alt"
        title: "移动开发"
        description: "Flutter、React Native、原生开发"
        progress: 100
      - icon: "fas fa-tools"
        title: "开发工具"
        description: "Git、Docker、VS Code、构建工具"
        progress: 100
  skills:
    - name: "JavaScript"
      level: 90
      description: "掌握ES6+特性、异步编程、模块化开发，熟悉Vue.js和React框架。"
      projects:
        - "个人博客系统"
        - "数据可视化平台"
        - "在线编辑器"
    - name: "HTML5"
      level: 90
      description: "精通语义化标签、Canvas绘图、Web Storage等HTML5新特性。"
      projects: []
    - name: "CSS3"
      level: 90
      description: "熟练使用Flexbox、Grid布局，掌握CSS动画和响应式设计。"
      projects: []
    - name: "Python"
      level: 90
      description: "熟悉Django、Flask框架，掌握数据分析和机器学习基础。"
      projects:
        - "自动化脚本工具"
        - "Web爬虫系统"
        - "数据分析报告"
    - name: "Flutter"
      level: 75
      description: "掌握Dart语言，熟悉Widget系统，能够开发跨平台应用。"
      projects:
        - "跨平台电商应用"
        - "社交应用开发"
        - "工具类应用"
    - name: "Rust"
      level: 55
      description: "了解Rust语言特性，掌握基础语法和内存安全机制。"
      projects: []
  timeline:
    - year: "2022"
      title: "基础学习"
      description: "掌握HTML、CSS、JavaScript基础，完成第一个个人网站项目。"
    - year: "2023"
      title: "框架掌握"
      description: "学习Vue.js和React框架，参与团队项目开发，掌握前后端分离架构。"
    - year: "2024"
      title: "全栈发展"
      description: "学习Node.js和Python后端开发，掌握数据库设计和API开发。"
    - year: "2025"
      title: "移动开发"
      description: "学习Flutter跨平台开发，完成多个移动应用项目。"
    - year: "2026"
      title: "技术深化"
      description: "学习Rust语言，深入研究性能优化和系统架构设计。"

