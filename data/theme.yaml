    methods:
      - type: "email"
        icon: "fas fa-envelope"
        label: "邮箱"
        value: "admin@azxt.org"
        link: "mailto:admin@azxt.org"
      - type: "github"
        icon: "fab fa-github"
        label: "GitHub"
        value: "aizexintong"
        link: "https://github.com/aizexintong"
      - type: "website"
        icon: "fas fa-globe"
        label: "网站"
        value: "azxt.org"
        link: "https://azxt.org"
    note: "欢迎交流技术问题、项目合作或开源贡献！"

