# ============================================================================
# 404 错误页面配置
# 控制用户访问不存在的路径时显示的页面内容和引导按钮
# ============================================================================
error404:

  # ----- 页面主信息 -----
  page:
    title: "404"                             # 404 页面大标题
    description: "页面不存在或已被移除"      # 简短错误说明
    message: "抱歉，你访问的页面不存在。可能已被删除或链接有误。"  # 详细错误提示信息
    icon: "fas fa-ghost"                     # 404 页面装饰图标（Font Awesome）

  # ----- 引导按钮 -----
  # 显示在错误页面底部，帮助用户快速导航到其他页面
  buttons:

    # 返回首页按钮
    home:
      text: "返回首页"                       # 按钮文字
      icon: "fas fa-home"                    # 按钮图标
      url: "/"                               # 点击跳转路径

    # 浏览文章按钮
    posts:
      text: "浏览文章"
      icon: "fas fa-file-alt"
      url: "/posts/"


# ============================================================================
# 标签（Tags）页面配置
# 控制标签聚合页面的标题、副标题和分页设置
# ============================================================================
tags:

  page:
    title: "标签"                            # 标签页标题
    subtitle: "浏览所有文章标签"             # 标签页副标题
    perPage: 25                              # 每页显示的标签数量，正整数


# ============================================================================
# 布局与视觉策略（Layout）
# 对所有页面生效的布局开关、视觉特效和性能策略进行统一配置
#
# 重要说明：
#   - 本配置描述“开关和策略”，不包含具体 CSS 数值（如像素、颜色等）
#   - 例如：配置 glass: true（启用毛玻璃），而不是 glassBlur: 24px
#   - 具体数值统一在 SCSS Token（_variables.scss / _tokens.scss）中管理
#   - 复杂交互逻辑由 TypeScript 脚本控制
#   - 修改任一配置项后需重新构建站点才能看到效果
# ============================================================================

layout:

  # --------------------------------------------------------------------------
  # 文章列表页布局
  # 控制文章列表的展示方式、分页数量、是否显示元信息等
  # --------------------------------------------------------------------------
  posts:
    layout: "grid"                           # 列表布局模式："grid" = 网格视图，"list" = 列表视图
    columns: 2                               # 当 layout="grid" 时每行的列数，正整数（通常 2 或 3）
    perPage: 12                              # 每页显示的文章数量，正整数
    excerptLength: 160                       # 文章摘要截取字符数，正整数

    showDate: true                           # 是否显示文章发布日期：true=显示，false=隐藏
    showCategory: true                       # 是否显示文章分类：true=显示，false=隐藏
    showTags: true                           # 是否显示文章标签：true=显示，false=隐藏
    showExcerpt: true                        # 是否显示文章摘要：true=显示，false=隐藏


  # --------------------------------------------------------------------------
  # 技能页面布局
  # 控制技能页各区块的显示/隐藏
  # --------------------------------------------------------------------------
  skills:
    layout: "grid"                           # 布局模式："grid" = 网格，"list" = 列表
    showCategories: true                     # 是否显示技能分类总览区块：true=显示，false=隐藏
    showDetailed: true                       # 是否显示详细技能列表区块：true=显示，false=隐藏
    showTimeline: true                       # 是否显示技能发展时间线区块：true=显示，false=隐藏
    showProjects: true                       # 是否在详细技能中显示相关项目列表：true=显示，false=隐藏


  # --------------------------------------------------------------------------
  # 友链页面布局
  # 控制友链列表的分组显示
  # --------------------------------------------------------------------------
  links:
    showCategory: true                       # 是否按分类分组显示友链：true=分组显示，false=平铺显示


  # --------------------------------------------------------------------------
  # 侧边栏（Sidebar）配置
  # 控制文章详情页侧边栏的位置和显示内容
  # --------------------------------------------------------------------------
  sidebar:
    position: "right"                        # 侧边栏位置："left" = 左侧，"right" = 右侧
    showTOC: true                            # 是否显示文章目录（Table of Contents）：true=显示，false=隐藏
    showInfo: true                           # 是否显示文章信息（作者、日期等）：true=显示，false=隐藏
    showTags: true                           # 是否显示标签云：true=显示，false=隐藏


  # --------------------------------------------------------------------------
  # 代码块（Code Block）配置
  # 控制文章中代码块的功能展示
  # --------------------------------------------------------------------------
  codeblock:
    showLang: true                           # 是否在代码块右上角显示编程语言名称：true=显示，false=隐藏
    showCopy: true                           # 是否显示“复制代码”按钮：true=显示，false=隐藏
    expandLines: 0                           # 超过多少行自动折叠代码块：0=不折叠，正整数=超过该行数则折叠
    lineNumbers: false                       # 是否显示代码行号：true=显示，false=隐藏


  # ==========================================================================
  # v1.1.0 全局视觉效果开关
  # 控制整个主题各页面中各种视觉特效的显示和启用状态
  # ==========================================================================

  effects:

    # ----- 视觉特效总开关 -----
    # true  = 所有启用的特效全部生效（各子项 false 的特效仍不会显示）
    # false = 无论子项如何配置，全局关闭所有视觉特效
    enabled: true

    # ----- 毛玻璃效果（Glass Morphism） -----
    # 为卡片、导航栏、侧边栏等元素添加半透明模糊背景效果
    glass: true                              # true=启用，false=关闭

    # ----- 背景极光效果（Aurora） -----
    # 在页面背景中渲染渐变流动的极光色彩效果
    # 使用纯 CSS 实现，不依赖 Canvas，性能优秀
    aurora: true                             # true=启用，false=关闭

    # ----- 鼠标跟随光晕（Mouse Glow） -----
    # 鼠标移动时在光标附近产生彩色光晕
    # 桌面端开启后生效，移动端由 TypeScript 自动检测并禁用
    mouseGlow: true                          # true=启用，false=关闭

    # ----- 卡片 3D 倾斜效果（Card 3D Tilt） -----
    # 鼠标悬停时卡片根据光标位置产生轻微 3D 倾斜，增强立体感
    # TypeScript 仅负责计算 3D 变换变量，实际 CSS transform 由样式表完成
    card3d: true                             # true=启用，false=关闭

    # ----- 卡片流光边缘效果（Card Shine） -----
    # 鼠标悬停时卡片边框产生动态流光高亮效果
    # 不会默认应用到所有卡片，仅用于首页、文章页等重点组件的卡片
    cardShine: true                          # true=启用，false=关闭

    # ----- 滚动渐现动画（Scroll Reveal） -----
    # 页面滚动时，元素进入可视区域后以淡入+上移动画渐显
    scrollReveal: true                       # true=启用，false=关闭

    # ----- Canvas 粒子背景效果（Particles） -----
    # 在页面背景中使用 Canvas 绘制动态粒子动画
    # 移动端和低性能设备下会自动降低粒子密度或关闭
    particles: true                          # true=启用，false=关闭

    # ----- 夜间星空效果（Night Sky） -----
    # 在暗色主题下渲染星尘、流星、萤火虫等动效
    # 仅在深色模式下生效
    nightSky: true                           # true=启用，false=关闭

    # ----- 页面背景微噪点（Noise） -----
    # 在页面背景添加极细微的噪点纹理，模拟纸质质感
    # 使用纯 CSS 实现，性能友好
    noise: true                              # true=启用，false=关闭


  # ==========================================================================
  # v1.1.0 Hero 首屏视觉增强
  # 控制首页 Hero 区域的专属视觉特效，独立于全局 effects 配置
  # ==========================================================================

  hero:

    # Hero 区域是否启用高级视觉层（所有子项的总开关）
    enhanced: true                           # true=启用增强效果，false=关闭所有 Hero 专属特效

    # Hero 背景极光效果（覆盖 Hero 区域背景）
    aurora: true                             # true=启用，false=关闭

    # Hero 玻璃内容层（Hero 文字区域使用毛玻璃背景）
    glass: true                              # true=启用，false=关闭

    # Hero 鼠标交互光晕（鼠标在 Hero 区域移动时的光晕跟随）
    mouseGlow: true                          # true=启用，false=关闭

    # Hero 装饰性粒子（Hero 区域独立的小型粒子动画）
    particles: true                          # true=启用，false=关闭

    # Hero 元素轻微浮动动画（头像、标题等元素的上下浮动效果）
    floating: true                           # true=启用，false=关闭


  # ==========================================================================
  # v1.1.0 卡片（Card）视觉效果
  # 控制所有页面卡片的交互效果和视觉增强
  # ==========================================================================

  cards:

    # 卡片毛玻璃效果（半透明模糊背景）
    glass: true                              # true=启用，false=关闭

    # 鼠标悬停时卡片微微上浮（translateY 变换）
    lift: true                               # true=启用，false=关闭

    # 鼠标悬停时卡片周围产生光晕
    glow: true                               # true=启用，false=关闭

    # 卡片内部鼠标跟随高光反射
    mouseGlow: true                          # true=启用，false=关闭

    # 卡片 3D 倾斜效果（根据鼠标位置计算倾斜角度）
    tilt: true                               # true=启用，false=关闭

    # 卡片内图片鼠标悬停时缩放效果（scale 放大）
    imageZoom: true                          # true=启用，false=关闭


  # ==========================================================================
  # v1.1.0 文章详情页（Article）增强
  # 控制单篇文章阅读页面的交互增强和视觉优化功能
  # ==========================================================================

  article:

    # 阅读进度条（固定在页面顶部，显示当前阅读进度百分比）
    readingProgress: true                    # true=启用，false=关闭

    # 文章标题区域增强（标题使用毛玻璃+极光背景等视觉效果）
    enhancedHeader: true                     # true=启用，false=关闭

    # 文章封面图视觉增强（封面图加载时淡入、视差滚动等效果）
    coverEffect: true                        # true=启用，false=关闭

    # 文章正文阅读宽度优化（限制文本最大宽度，提升长篇阅读体验）
    readableLayout: true                     # true=启用，false=关闭

    # 文章底部推荐阅读区块增强（卡片化显示，带缩略图和动画）
    relatedPosts: true                       # true=启用，false=关闭


  # ==========================================================================
  # v1.1.0 性能策略（Performance）
  #
  # 控制主题如何根据设备能力和用户偏好自动调整视觉特效等级，
  # 在视觉效果和运行流畅度之间取得平衡。
  #
  # auto 配置说明：
  #   true  -> TypeScript 运行时根据设备硬件能力自动选择性能等级
  #   false -> 使用 level 字段强制指定性能等级，不进行自动检测
  #
  # level 可选值：
  #   "low"    - 最低特效：关闭所有 Canvas 动画，仅保留基础 CSS 效果
  #   "normal" - 标准特效：启用主要视觉特效，降低粒子密度（默认推荐）
  #   "high"   - 最高特效：所有效果全开，适合高性能桌面设备
  #
  # 手动锁定性能等级的示例用法：
  #   auto: false
  #   level: "low"
  # 不需要修改 TypeScript 源码即可测试不同性能等级的表现。
  # ==========================================================================

  performance:

    # 是否自动检测设备性能并选择合适的等级：true=自动检测，false=手动指定
    auto: true

    # 当 auto=false 时，手动指定的性能等级："low" / "normal" / "high"
    level: "normal"

    # 是否尊重用户的 reduced-motion 系统偏好：检测到该偏好时自动降级特效
    respectReducedMotion: true               # true=尊重用户偏好，false=忽略

    # 页面切换到后台标签页时是否暂停 Canvas 和 CSS 动画以节省资源
    pauseWhenHidden: true                    # true=后台暂停，false=持续运行

    # 移动设备是否自动降低特效等级，保证电池续航和流畅度
    reduceOnMobile: true                     # true=自动降低，false=不作区分

    # 低性能设备（如旧款手机、集成显卡）是否自动降低特效
    reduceOnLowPower: true                   # true=自动降低，false=不作区分

    # Canvas 是否自动降低设备像素比（DPR），用稍低分辨率换取更高帧率
    adaptiveDpr: true                        # true=自动调整 DPR，false=使用设备原生 DPR

    # Canvas 粒子数量是否根据设备性能动态调整
    adaptiveParticles: true                  # true=动态调整粒子数，false=使用默认粒子数

    # 是否根据实时 FPS 自动降级特效（当帧率过低时自动减少特效）
    adaptiveFps: true                        # true=启用 FPS 自适应，false=不降级


  # ==========================================================================
  # v1.1.0 无障碍（Accessibility）访问
  #
  # 确保网站对所有用户（包括使用辅助技术的用户）都友好可用。
  # 所有选项开启后，主题会确保视觉特效层不影响屏幕阅读器、
  # 键盘导航等无障碍功能。
  # ==========================================================================

  accessibility:

    # 是否尊重用户的 prefers-reduced-motion 设置：检测到后关闭非必要动画
    reducedMotion: true                      # true=尊重用户设置，false=忽略

    # 是否保证键盘导航功能完整（Tab 键可访问所有交互元素）
    keyboardNavigation: true                 # true=启用键盘导航，false=仅鼠标交互

    # 是否保证焦点指示器可见（:focus-visible 样式兜底）
    visibleFocus: true                       # true=强制显示焦点框，false=隐藏焦点样式

    # 是否确保所有装饰性图层设置 pointer-events: none，不阻挡点击和交互
    decorativeEffectsPointerEventsNone: true # true=装饰层不拦截点击，false=装饰层可交互