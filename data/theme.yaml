# ============================================================================
# 标签页配置
# ============================================================================
tags:
  page:
    title: "标签"
    subtitle: "浏览所有文章标签"
    perPage: 25

# ============================================================================
# 布局与样式参数（从原 layout 节点移入，仅保留样式相关）
# ============================================================================
layout:
  posts:
    layout: "grid"
    columns: 2
    perPage: 12
    excerptLength: 160
    showDate: true
    showCategory: true
    showTags: true
    showExcerpt: true

  skills:
    layout: "grid"
    showCategories: true
    showDetailed: true
    showTimeline: true
    showProjects: true

  links:
    showCategory: true

  sidebar:
    position: "right"
    showTOC: true
    showInfo: true
    showTags: true

  codeblock:
    showLang: true
    showCopy: true
    expandLines: 0
    lineNumbers: false