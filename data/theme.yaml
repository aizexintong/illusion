# ============================================================================
# 幻梦 Illusion v1.1.0 - 统一主题数据配置文件
# 正式预览版
# ============================================================================
# 使命: 统一管理页面内容数据、布局策略、视觉效果开关与个性化配置项。
#       本文件是主题的核心配置入口，所有面向用户的数据展示与视觉行为
#       均在此文件中进行声明和控制。
#
# 配置原则:
#   1. UI 文案统一在 i18n/zh-CN.yaml 中管理，本文件不出现用户可见文本
#   2. 视觉具体数值（颜色、间距、圆角等）由 SCSS Token 管理，不在此定义
#   3. 复杂交互逻辑（动画序列、事件处理等）由 TypeScript 管理
#   4. 本文件只描述“是否启用某个功能 / 使用什么布局模式 / 展示什么内容”
#   5. 采用单文件架构，所有主题配置集中于此，不拆分，便于查找与维护
#   6. 修改本文件后需要重新构建站点（hugo --gc）才能生效
# ============================================================================


# ============================================================================
# 首页（Home）配置
# 控制网站首页的各个区块：首屏大标题、文章列表、个人简介、技能展示
# ============================================================================
home:

  # --------------------------------------------------------------------------
  # Hero 首屏大标题区域
  # 控制首页第一屏的核心内容：主标题、轮播副标题、描述文案、按钮、徽章等
  # --------------------------------------------------------------------------
  hero:
    title: "爱则心痛"                       # 主标题，显示在首屏最显著位置

    subtitles:                               # 副标题轮播列表，按顺序循环显示
      - "技术开发者"
      - "代码艺术家"
      - "终身学习者"
      - "梦想追逐者"

    description: "欢迎来到我的个人空间，这里记录着我的技术探索、生活感悟和成长历程。"  # 描述段落，展示在主标题下方

    primaryBtn:                              # 主按钮（强调色按钮）
      text: "阅读文章"                       # 按钮文字
      url: "/posts"                          # 点击后跳转的路径

    secondaryBtn:                            # 次按钮（轮廓样式按钮）
      text: "关于我们"                       # 按钮文字
      url: "/about"                          # 点击后跳转的路径

    badgeText: "欢迎来到我的世界"            # 首屏顶部小徽章文字
    greeting: "你好，我是"                   # 主标题前的问候语

    quote:                                   # 首屏底部引用语
      text: "代码是诗，键盘是笔，屏幕是画布，让我们一起书写数字世界的篇章。"
      author: "爱则心痛"                     # 引用语署名


  # --------------------------------------------------------------------------
  # 首页文章列表区块
  # 控制首页展示的最新文章数量、标题文字和“查看更多”按钮
  # --------------------------------------------------------------------------
  posts:
    title: "最新文章"                        # 区块标题
    subtitle: "分享思考，记录成长"           # 区块副标题（描述性文案）
    count: 6                                 # 首页展示的文章数量，接受正整数，建议 3-6

    showMore:                                # “查看更多”按钮配置
      text: "查看所有文章"                   # 按钮文字
      url: "/posts"                          # 按钮跳转路径，通常指向文章列表页


  # --------------------------------------------------------------------------
  # 首页“关于我”简介区块
  # 控制首页个人简介卡片的内容和“了解更多”按钮
  # --------------------------------------------------------------------------
  about:
    title: "关于爱则心痛"                    # 简介区块标题
    description: "一名热爱技术的开发者，专注于前端开发、移动应用和新兴技术。相信代码可以改变世界，享受解决问题的过程，热爱分享知识。"  # 个人简介段落
    btnText: "了解更多"                      # “了解更多”按钮文字
    btnUrl: "/about"                         # 按钮跳转路径，指向关于页面


  # --------------------------------------------------------------------------
  # 首页技能展示区块
  # 控制首页展示的技能数量、标题和副标题
  # --------------------------------------------------------------------------
  skills:
    title: "技术栈"                          # 区块标题
    subtitle: "不断学习，持续进步"           # 区块副标题
    count: 6                                 # 首页展示的技能条目数量，接受正整数


# ============================================================================
# 关于（About）页面配置
# 控制独立的“关于”页面内容：个人信息、数据统计、技术理念、联系方式
# ============================================================================
about:

  # ----- 个人信息头部 -----
  intro:
    name: "爱则心痛 (azxt)"                  # 你的名字 / 昵称
    title: "全栈开发者 · 技术爱好者 · 开源贡献者"  # 个人头衔 / 一句话简介
    quote: "代码如诗，技术如画。在0和1的世界里，创造无限可能。"  # 个人座右铭

  # ----- 数据统计卡片 -----
  # 每项配置一个统计卡片，展示图标、数量和标签文字
  # number 设为 "auto" 时，主题会自动从 Hugo 数据中计算对应数值
  stats:
    - icon: "fas fa-code"                    # Font Awesome 图标类名
      number: "auto"                         # 显示数量，"auto" = 主题自动统计，或手动填写如 "100"
      label: "技术文章"                      # 统计项标签文字

    - icon: "fas fa-project-diagram"
      number: "auto"                         # "auto" = 根据技能数据自动统计
      label: "技术技能"

    - icon: "fas fa-calendar-alt"
      number: "8+"                           # 手动填写固定数值（或 "auto"）
      label: "开发经验"

    - icon: "fas fa-heart"
      number: "∞"                            # 特殊值，直接展示
      label: "热爱程度"

  # ----- 技术理念区块 -----
  philosophy:
    title: "技术理念"                        # 理念区块标题

    items:                                   # 理念条目列表，每项包含图标、标题、描述
      - icon: "fas fa-feather-alt"           # Font Awesome 图标
        title: "优雅简洁"                    # 理念关键词
        description: "追求代码的简洁性和可维护性，相信好的代码本身就是最好的文档"

      - icon: "fas fa-graduation-cap"
        title: "持续学习"
        description: "技术日新月异，保持好奇心和学习能力是开发者最重要的品质"

      - icon: "fas fa-share-alt"
        title: "分享共赢"
        description: "知识因分享而更有价值，开源精神推动技术进步"

      - icon: "fas fa-user-check"
        title: "用户体验"
        description: "技术服务于人，优秀的用户体验是产品的灵魂"

  # ----- 联系方式区块 -----
  contact:
    title: "保持联系"                        # 联系方式区块标题
    subtitle: "如果你对我的工作感兴趣，或者有任何技术问题想要讨论"  # 区块副标题

    methods:                                 # 联系方式列表，每个方法包含类型、图标、标签、值和链接
      - type: "email"                        # 联系方式类型标识
        icon: "fas fa-envelope"              # 显示图标
        label: "邮箱"                        # 显示标签
        value: "admin@azxt.org"              # 显示的值（如邮箱地址）
        link: "mailto:admin@azxt.org"        # 点击跳转链接（mailto: 表示邮件）

      - type: "github"
        icon: "fab fa-github"
        label: "GitHub"
        value: "aizexintong"                 # GitHub 用户名
        link: "https://github.com/aizexintong"

      - type: "website"
        icon: "fas fa-globe"
        label: "网站"
        value: "azxt.org"                    # 网站域名
        link: "https://azxt.org"

    note: "欢迎交流技术问题、项目合作或开源贡献！"  # 联系方式底部备注文字


# ============================================================================
# 图片资源（Assets）管理
# 统一管理站点所有图片的 URL 路径、替代文本和默认值，包括头像、
# 背景图、开放图谱（OpenGraph）分享图以及各类默认占位图
# ============================================================================
assets:

  # ----- 站点头像 -----
  avatar:
    url: "/headimg.jpg"                      # 头像图片的 URL 路径，支持本地路径或完整 URL
    alt: "站点头像"                           # 图片加载失败或无障碍访问时显示的替代文本

  # ----- 背景图片 -----
  # 支持三种模式：移动端专用、桌面端专用、自适应背景，主题会根据设备类型自动选择
  background:

    # 移动端背景图（屏幕宽度 ≤ 768px 时使用）
    mobile:
      url: "https://t.alcy.cc/mp"            # 背景图 URL，建议使用竖屏比例图片
      alt: "移动端背景"                       # 图片替代文本

    # 桌面端背景图（屏幕宽度 > 768px 时使用）
    desktop:
      url: "https://t.alcy.cc/pc"            # 背景图 URL，建议使用横屏比例图片
      alt: "桌面端背景"

    # 自适应背景图（推荐使用，自动适配不同设备和分辨率）
    adaptive:
      url: "https://t.alcy.cc/ycy"           # 背景图 URL，不区分移动端和桌面端
      alt: "自适应背景"
      description: "推荐使用，自动适配不同设备"  # 对该模式的简要说明文字

  # ----- 开放图谱（OpenGraph）分享图 -----
  # 当用户在社交媒体（微信、Twitter、Facebook 等）分享链接时展示的图片
  openGraph:

    default:
      url: "https://t.alcy.cc/og"            # OG 图片 URL
      alt: "分享配图"                         # 图片替代文本
      width: 1200                            # 图片宽度（像素），OpenGraph 标准推荐 1200
      height: 630                            # 图片高度（像素），标准比例 1.91:1

  # ----- 默认占位图 -----
  # 当某篇文章没有指定封面、友链没有上传头像、技能没有定义图标时，
  # 使用此处定义的默认值作为回退显示
  defaults:
    postCover: "https://t.alcy.cc/ycy"       # 文章默认封面图 URL
    friendAvatar: "https://t.alcy.cc/tx"     # 友链默认头像 URL
    skillIcon: "fas fa-code"                 # 技能默认图标（Font Awesome 类名）


# ============================================================================
# 社交链接（Social）配置
# 控制网站各位置（首页、关于页、侧边栏、页脚等）显示的社交平台链接图标
# 每个平台可单独控制是否显示（show: true/false）
# ============================================================================
social:

  links:                                     # 社交链接列表，顺序决定图标排列顺序

    - platform: "github"                     # 平台标识，内部用于逻辑判断
      url: "https://github.com/aizexintong"  # 链接地址
      icon: "fab fa-github"                  # Font Awesome 图标类名
      label: "GitHub"                        # 悬停提示文字和辅助标签
      show: true                             # 是否启用并显示该社交图标：true=显示，false=隐藏

    - platform: "email"
      url: "mailto:admin@azxt.org"
      icon: "fas fa-envelope"
      label: "邮箱"
      show: true

    - platform: "rss"
      url: "/index.xml"                      # RSS 订阅地址，通常指向 Hugo 生成的 index.xml
      icon: "fas fa-rss"
      label: "RSS 订阅"
      show: true

    - platform: "twitter"
      url: "https://twitter.com"
      icon: "fab fa-twitter"
      label: "Twitter"
      show: false                            # false = 不显示，可设为 true 启用

    - platform: "telegram"
      url: "https://telegram.org"
      icon: "fab fa-telegram"
      label: "Telegram"
      show: false

    - platform: "wechat"
      url: ""                                # 微信暂不配置链接，可填写个人微信二维码图片 URL
      icon: "fab fa-weixin"
      label: "微信"
      show: false


# ============================================================================
# 技能（Skills）页面配置
# 控制独立技能页面的内容：分类总览（带进度条）、详细技能（带项目列表）、
# 技能发展时间线
# ============================================================================
skills:

  # ----- 技能分类总览 -----
  # 以卡片+进度条形式展示各技术方向的大类概况
  overview:

    categories:                              # 技能分类列表

      - icon: "fas fa-code"                  # 分类图标（Font Awesome）
        title: "前端开发"                    # 分类名称
        description: "HTML5、CSS3、JavaScript、React"  # 分类简述，展示在卡片中
        progress: 100                        # 进度条百分比：0-100，仅作为视觉展示参考

      - icon: "fas fa-server"
        title: "后端开发"
        description: "Node.js、Python、数据库、API"
        progress: 100

      - icon: "fas fa-mobile-alt"
        title: "移动开发"
        description: "Flutter、React Native、原生开发"
        progress: 100

      - icon: "fas fa-tools"
        title: "开发工具"
        description: "Git、Docker、VS Code、构建工具"
        progress: 100


  # ----- 详细技能列表 -----
  # 以条目形式展示每项技能的掌握程度、描述和相关项目经历
  skills:

    - name: "JavaScript"                     # 技能名称
      level: 90                              # 掌握程度：0-100，数字越大越熟练
      description: "掌握ES6+特性、异步编程、模块化开发，熟悉Vue.js和React框架。"  # 技能描述段落
      projects:                              # 与该技能相关的项目列表，可为空数组 []
        - "个人博客系统"
        - "数据可视化平台"
        - "在线编辑器"

    - name: "HTML5"
      level: 90
      description: "精通语义化标签、Canvas绘图、Web Storage等HTML5新特性。"
      projects: []

    - name: "CSS3"
      level: 90
      description: "熟练使用Flexbox、Grid布局，掌握CSS动画和响应式设计。"
      projects: []

    - name: "Python"
      level: 90
      description: "熟悉Django、Flask框架，掌握数据分析和机器学习基础。"
      projects:
        - "自动化脚本工具"
        - "Web爬虫系统"
        - "数据分析报告"

    - name: "Flutter"
      level: 75
      description: "掌握Dart语言，熟悉Widget系统，能够开发跨平台应用。"
      projects:
        - "跨平台电商应用"
        - "社交应用开发"
        - "工具类应用"

    - name: "Rust"
      level: 55
      description: "了解Rust语言特性，掌握基础语法和内存安全机制。"
      projects: []


  # ----- 技能发展时间线 -----
  # 以时间轴形式展示技术成长历程
  timeline:

    - year: "2022"                           # 时间节点（年份）
      title: "基础学习"                      # 该阶段标题
      description: "掌握HTML、CSS、JavaScript基础，完成第一个个人网站项目。"  # 阶段描述

    - year: "2023"
      title: "框架掌握"
      description: "学习Vue.js和React框架，参与团队项目开发，掌握前后端分离架构。"

    - year: "2024"
      title: "全栈发展"
      description: "学习Node.js和Python后端开发，掌握数据库设计和API开发。"

    - year: "2025"
      title: "移动开发"
      description: "学习Flutter跨平台开发，完成多个移动应用项目。"

    - year: "2026"
      title: "技术深化"
      description: "学习Rust语言，深入研究性能优化和系统架构设计。"


# ============================================================================
# 友链（Friends）页面配置
# 控制友情链接页面的完整内容：友链列表、申请条件、本站信息、联系方式
# ============================================================================
friends:

  # ----- 友链列表 -----
  friends:

    - name: "示例友链"                       # 友链站点的名称
      url: "https://example.com"             # 友链站点的网址
      avatar: "https://t.alcy.cc/tx"         # 友链头像 URL
      description: "这是一个示例友链的描述"  # 友链站点的简要描述
      category: "技术博客"                   # 所属分类，用于分组显示

    - name: "技术博客示例"
      url: "https://tech.example.com"
      avatar: "https://t.alcy.cc/ai"
      description: "分享前沿技术文章和开发经验"
      category: "技术分享"

    - name: "学习笔记"
      url: "https://learn.example.com"
      avatar: "https://t.alcy.cc/moe"
      description: "记录学习过程中的心得体会"
      category: "学习笔记"


  # ----- 申请友链区块 -----
  # 展示申请条件、本站信息和联系方式，引导访问者申请交换友链
  apply:

    title: "申请友链"                        # 申请区块标题

    conditions:                              # 申请条件列表
      - "内容优质，原创技术文章优先"
      - "定期更新，保持活跃"
      - "无不良内容，健康向上"
      - "已添加本站链接"

    siteInfo:                                # 本站信息，方便申请者填写
      name: "爱则心痛 (azxt)"               # 本站名称
      url: "https://azxt.org"               # 本站网址
      description: "爱则心痛的个人博客 - 分享技术、生活和思考"  # 本站描述

    contactTitle: "联系方式"                  # 联系方式区块标题
    contactDescription: "如果你符合条件并希望交换链接，请通过以下方式联系："  # 联系方式引导语

    contactMethods:                          # 联系方式列表

      - icon: "fas fa-envelope"              # 联系方式图标
        label: "发送邮件"                    # 联系方式标签文字
        link: "mailto:admin@azxt.org"        # 链接地址

      - icon: "fab fa-github"
        label: "GitHub Issues"
        link: "https://github.com/aizexintong/illusion/issues"


# ============================================================================
# 工具（Tools）页面配置
# 控制工具推荐页面的所有内容：工具分类和每个分类下的具体工具条目
# ============================================================================
tools:

  categories:                                # 工具分类列表

    - name: "开发工具"                       # 分类名称
      icon: "fas fa-code"                    # 分类图标
      description: "编程开发相关的工具软件"  # 分类描述

      tools:                                 # 该分类下的工具列表

        - name: "Visual Studio Code"         # 工具名称
          url: "https://code.visualstudio.com"  # 工具官网或下载地址
          description: "强大的代码编辑器，支持多种编程语言"  # 工具简要描述
          icon: "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/visualstudiocode.svg"  # 工具图标 URL，支持 SVG

        - name: "Git"
          url: "https://git-scm.com"
          description: "分布式版本控制系统"
          icon: "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/git.svg"

        - name: "Docker"
          url: "https://www.docker.com"
          description: "容器化平台"
          icon: "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/docker.svg"

        - name: "Postman"
          url: "https://www.postman.com"
          description: "API 测试和开发工具"
          icon: "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/postman.svg"


    - name: "设计工具"
      icon: "fas fa-palette"
      description: "UI/UX 设计和图像处理工具"

      tools:

        - name: "Figma"
          url: "https://www.figma.com"
          description: "协作式 UI 设计工具"
          icon: "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/figma.svg"

        - name: "Canva"
          url: "https://www.canva.com"
          description: "在线图形设计平台"
          icon: "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/canva.svg"


    - name: "效率工具"
      icon: "fas fa-bolt"
      description: "提升工作效率的辅助工具"

      tools:

        - name: "Notion"
          url: "https://www.notion.so"
          description: "全能笔记和知识管理工具"
          icon: "https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/notion.svg"

        - name: "Raycast"
