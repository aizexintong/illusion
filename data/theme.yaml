    title: "爱则心痛"
    subtitles:
      - "技术开发者"
      - "代码艺术家"
      - "终身学习者"
      - "梦想追逐者"
    description: "欢迎来到我的个人空间，这里记录着我的技术探索、生活感悟和成长历程。"
    primaryBtn:
      text: "阅读文章"
      url: "/posts"
    secondaryBtn:
      text: "关于我们"
      url: "/about"
    badgeText: "欢迎来到我的世界"
    greeting: "你好，我是"
    quote:
      text: "代码是诗，键盘是笔，屏幕是画布，让我们一起书写数字世界的篇章。"
      author: "爱则心痛"
  posts:
    title: "最新文章"
    subtitle: "分享思考，记录成长"
    count: 6
    showMore:
      text: "查看所有文章"
      url: "/posts"
  about:
    title: "关于爱则心痛"
    description: "一名热爱技术的开发者，专注于前端开发、移动应用和新兴技术。相信代码可以改变世界，享受解决问题的过程，热爱分享知识。"
