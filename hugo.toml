# =============================================================================
# 幻梦 Illusion 主题 - Hugo 站点配置
# 使命：站点核心配置与功能开关，后期随心调整的主要文件
# 修改频率：经常调整
# =============================================================================

# ---------------------------------------------------------------------------
# 站点基本信息
# ---------------------------------------------------------------------------
baseURL = 'https://azxt.org/'
locale = 'zh-CN'
languageName = '中文'
title = '爱则心痛(演示) | azxt'
theme = 'illusion'
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
enableGitInfo = true

# ---------------------------------------------------------------------------
# 功能开关（最常调整的部分）
# ---------------------------------------------------------------------------
[params]
  # -- 个人信息 --
  author = "爱则心痛(演示)"
  description = "爱则心痛(演示)的个人博客 - 分享技术、生活和思考"
  email = "admin@azxt.org"
  github = "aizexintong"
  domain = "azxt.org"
  siteTime = "2026-04-01T00:00:00+08:00"

  # -- 功能开关 --
  enableDarkMode = true
  enableSearch = true
  searchProvider = "local"
  enableParticles = true
  enable3DEffects = true
  enableScrollAnimations = true
  enableTypewriter = true
  enableAccessibility = true
  enableTOC = true
  enableComments = false
  lazyLoadImages = true

  # -- SEO / 社交分享 --
  enableSchema = true
  enableOpenGraph = true
  enableTwitterCards = true

# ---------------------------------------------------------------------------
# 导航菜单
# ---------------------------------------------------------------------------
[menus]
  [[menus.main]]
    name = '首页'
    pageRef = '/'
    weight = 5
    [menus.main.params]
      icon = 'fas fa-home'

  [[menus.main]]
    name = '文章'
    pageRef = '/posts'
    weight = 10
    [menus.main.params]
      icon = 'fas fa-file-alt'

  [[menus.main]]
    name = '归档'
    url = '/archives/'
    weight = 15
    [menus.main.params]
      icon = 'fas fa-archive'

  [[menus.main]]
    name = '标签'
    pageRef = '/tags/'
    weight = 20
    [menus.main.params]
      icon = 'fas fa-tags'

  [[menus.main]]
    name = '关于'
    pageRef = '/about'
    weight = 30
    [menus.main.params]
      icon = 'fas fa-user'

  [[menus.main]]
    name = '技能'
    url = '/skills/'
    weight = 40
    [menus.main.params]
      icon = 'fas fa-code'

  [[menus.main]]
    name = '友链'
    url = '/links/'
    weight = 50
    [menus.main.params]
      icon = 'fas fa-link'

  [[menus.main]]
    name = '工具'
    url = '/tools/'
    weight = 60
    [menus.main.params]
      icon = 'fas fa-tools'

  # 页脚导航
  [[menus.footer]]
    name = '隐私政策'
    url = '/privacy/'
    weight = 10
    [menus.footer.params]
      icon = 'fas fa-shield-alt'

  [[menus.footer]]
    name = '使用条款'
    url = '/terms/'
    weight = 20
    [menus.footer.params]
      icon = 'fas fa-file-contract'

# ---------------------------------------------------------------------------
# Markdown 渲染与代码高亮
# ---------------------------------------------------------------------------
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    tabWidth = 2
    lineNos = false

# ---------------------------------------------------------------------------
# 输出格式
# ---------------------------------------------------------------------------
[outputs]
  home = ["HTML", "JSON", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# ---------------------------------------------------------------------------
# Sitemap
# ---------------------------------------------------------------------------
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5