# 幻梦 Illusion v1.1.0 - 主题仓库推送后自动通知父站点重建 - 正式预览版
#
# 前置条件：仓库密钥 DISPATCH_TOKEN
#   - fine-grained PAT：仅授权 aizexintong/illusion-dome，权限选 Contents: Read and write
#   - 或 classic PAT：勾选 repo 权限
#   在主题仓库 Settings → Secrets and variables → Actions 中添加/更新。
#
# 容错策略：
#   令牌缺失或失效时只输出 warning 并跳过通知，不让工作流失败；
#   演示站点另有每日定时重建兜底（见 illusion-dome/.github/workflows/hugo.yml）。
name: 检测到主题代码推送后通知父站点重建

on:
  push:
    branches: ["main"]
  # 支持在 Actions 页面手动触发，便于更新 DISPATCH_TOKEN 后立即验证
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: 检查 DISPATCH_TOKEN 是否可用
        id: check
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TARGET_REPO: aizexintong/illusion-dome
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::未配置 DISPATCH_TOKEN，跳过 repository_dispatch。请到主题仓库 Settings → Secrets and variables → Actions 添加该密钥。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO")
          if [ "$status" != "200" ]; then
            echo "::warning::DISPATCH_TOKEN 无效或已过期（GET /repos/$TARGET_REPO 返回 $status），跳过通知。请重新生成 PAT 并更新密钥。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 向 illusion-dome 父站点仓库发送 repository_dispatch 事件触发重建
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DISPATCH_TOKEN }}
          repository: aizexintong/illusion-dome
          event-type: theme-updated
          client-payload: '{"sha":"${{ github.sha }}"}'
